<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Prototype(Pure HTML &CSS)</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js" defer></script>
</head>
<main class="chat-interface">
        <header class="chat-header">
            <h1>Chat Assistant</h1>
            <h6 class="sub-title">Prototype: Pure HTML/CSS (Static)</h6>
        </header>

        <section class="message" id="messages"></section>

         <form class="input">
            <input type="text" placeholder="Type your message..." disabled>
            <button type="submit" disabled>Send</button>
        </form>
        <footer class="info">
            <p>
                ℹ️ This is a static HTML/CSS demonstration. The input is disabled. See other approaches for
                interactive versions. 
            </p>
        </footer>
    </main>
</body>
</html>
