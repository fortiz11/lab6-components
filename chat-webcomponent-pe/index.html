<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Prototype(Pure HTML &CSS)</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="chat-component.js" defer></script>
    </head>
    <body>
        
    <main class="chat-interface">
        <header class="chat-header">
            <h1>Chat Assistant</h1>
            <h6 class="sub-title"></h6>
        </header>
<simple-chat class="chat-interface">
    <section class="messages">
        <div class="message-bot">
            <div class="bubble">
                Hello I'm your chat assistant!
            </div>
        </div>
    </section>
         <form class="input">
            <input class="user-input" type="text" placeholder="Type your message...">
            <button id= "send-button" type="submit">Send</button>
        </form>
  </simple-chat>
    </main>
    </body>
</html>
