<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Prototype(Pure HTML &CSS)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="chat-interface">
        <header>
            <h1>Chat Assistant</h1>
            <h3>Prototype: Pure HTML/CSS (Static)</h3>
        </header>
        <section class="messages">
            <div class="message bot">
                <div class="bubble">Hello! I'm here to chat with you. How can I help you today?</div>
            </div>
            <div class="user">
                <div class="bubble">Hi there! What can you do?</div>
            </div>
            <div class="message bot">
                <div class="bubble">I can chat with you about various topics. Try asking me a question or
                    or just say hello!</div>
                </div>
            <div class="user">
                <div class="bubble">How does this work?</div>
            </div>
        </section>

        <form class="input">
            <input type="text" placeholder="Type your message..." disabled>
            <button type="submit" disabled>Send</button>
        </form>

        


    </main>
</body>
</html>
